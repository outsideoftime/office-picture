<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OfficePicture 可点击原型</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      background: #eef1f5;
      color: #202124;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button { font: inherit; }
    .prototype-shell { width: min(1180px, calc(100% - 32px)); margin: 24px auto; }
    .prototype-header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 12px; }
    .prototype-title { margin: 0; font-size: 20px; font-weight: 600; }
    .prototype-note { margin: 4px 0 0; color: #61656b; font-size: 13px; }
    .host-switcher { display: flex; gap: 4px; padding: 4px; border: 1px solid #d7dbe1; background: #fff; border-radius: 8px; }
    .host-button { border: 0; border-radius: 5px; padding: 7px 12px; color: #4a4e54; background: transparent; cursor: pointer; }
    .host-button[aria-pressed="true"] { color: #fff; background: #2563eb; }
    .office-window { position: relative; height: min(700px, calc(100vh - 150px)); min-height: 520px; overflow: hidden; border: 1px solid #aeb4bc; border-radius: 8px; background: #f5f5f5; box-shadow: 0 16px 50px rgba(15, 23, 42, .16); }
    .office-titlebar { height: 32px; display: flex; align-items: center; justify-content: center; background: #185abd; color: white; font-size: 12px; }
    .office-ribbon { height: 88px; border-bottom: 1px solid #d5d8dc; background: #fafafa; }
    .ribbon-tabs { height: 32px; display: flex; align-items: center; gap: 24px; padding: 0 22px; color: #3d4147; font-size: 12px; }
    .ribbon-tabs span:first-child { color: #185abd; border-bottom: 2px solid #185abd; height: 32px; display: flex; align-items: center; }
    .ribbon-tools { height: 56px; display: flex; gap: 22px; padding: 8px 22px; }
    .tool-group { width: 100px; border-right: 1px solid #e0e2e5; }
    .tool-lines { width: 70px; height: 6px; margin: 4px 0; border-radius: 2px; background: #d9dde2; }
    .office-workspace { height: calc(100% - 120px); position: relative; overflow: hidden; background: #e6e7e9; }
    .word-page { position: absolute; left: 50%; top: 28px; width: min(620px, 75%); height: calc(100% - 56px); transform: translateX(-50%); background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.14); padding: 52px 58px; }
    .document-line { height: 7px; margin-bottom: 10px; border-radius: 2px; background: #dfe3e8; }
    .document-line.short { width: 68%; }
    .document-line.tiny { width: 45%; }
    .picture-selection { position: relative; width: min(360px, 88%); aspect-ratio: 16/9; margin: 30px auto 25px; cursor: default; outline: 2px solid #2b74d8; outline-offset: 4px; background: #0f273d; user-select: none; }
    .picture-selection::after { content: "双击查看大图"; position: absolute; left: 50%; bottom: -32px; transform: translateX(-50%); padding: 4px 10px; white-space: nowrap; border-radius: 4px; background: #202124; color: #fff; font-size: 12px; opacity: .86; }
    .selection-handle { position: absolute; width: 8px; height: 8px; border: 1px solid #2466bd; background: #fff; }
    .selection-handle.tl { left: -8px; top: -8px; }
    .selection-handle.tr { right: -8px; top: -8px; }
    .selection-handle.bl { left: -8px; bottom: -8px; }
    .selection-handle.br { right: -8px; bottom: -8px; }
    .sample-art { width: 100%; height: 100%; display: block; }
    .preview-overlay { position: absolute; inset: 12px; display: none; flex-direction: column; overflow: hidden; border: 1px solid #333337; background: #1c1c1e; color: #fff; box-shadow: 0 14px 45px rgba(0,0,0,.36); }
    .preview-overlay.is-open { display: flex; }
    .preview-toolbar { min-height: 44px; display: flex; align-items: center; gap: 4px; padding: 6px 12px; background: #262629; color: #fff; white-space: nowrap; }
    .preview-brand { margin-right: 12px; font-weight: 600; }
    .preview-command { min-height: 30px; padding: 4px 10px; border: 1px solid transparent; border-radius: 3px; background: transparent; color: #fff; cursor: pointer; }
    .preview-command:hover { border-color: #66676c; background: #39393d; }
    .preview-command:active { background: #4a4a4f; }
    .preview-divider { width: 1px; height: 22px; margin: 0 4px; background: #56565b; }
    .zoom-readout { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
    .preview-spacer { flex: 1; }
    .image-size { color: #dcdcdc; font-size: 12px; }
    .preview-close { margin-left: 6px; }
    .preview-viewport { position: relative; flex: 1; overflow: auto; background: #1c1c1e; }
    .image-stage { min-width: 100%; min-height: 100%; position: relative; }
    .preview-image { position: absolute; display: block; width: 1920px; height: 1080px; max-width: none; box-shadow: 0 2px 16px rgba(0,0,0,.32); transform-origin: top left; }
    .prototype-footer { display: flex; justify-content: space-between; gap: 16px; padding-top: 10px; color: #646970; font-size: 12px; }
    kbd { padding: 1px 5px; border: 1px solid #bfc4ca; border-bottom-width: 2px; border-radius: 3px; background: #fff; color: #34383d; font-family: inherit; }
    @media (max-width: 820px) {
      .prototype-shell { width: calc(100% - 16px); margin: 8px auto; }
      .prototype-header { align-items: stretch; flex-direction: column; gap: 8px; }
      .host-switcher { align-self: flex-start; }
      .office-window { height: 650px; min-height: 500px; }
      .word-page { width: 88%; padding: 42px 30px; }
      .preview-toolbar { flex-wrap: wrap; }
      .preview-spacer { display: none; }
      .image-size { margin-left: auto; }
    }
    @media (max-width: 560px) {
      .office-ribbon { height: 68px; }
      .ribbon-tools { height: 36px; padding: 5px 14px; }
      .ribbon-tabs { padding: 0 14px; gap: 14px; }
      .office-workspace { height: calc(100% - 100px); }
      .word-page { top: 18px; height: calc(100% - 36px); padding: 34px 20px; }
      .preview-overlay { inset: 6px; }
      .preview-brand { width: 100%; }
      .image-size { display: none; }
      .preview-close { margin-left: auto; }
      .prototype-footer { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="prototype-shell">
    <header class="prototype-header">
      <div>
        <h1 class="prototype-title">OfficePicture 可点击原型</h1>
        <p class="prototype-note">在文档中双击已选图片，体验实际 1.0 的预览与缩放路径。</p>
      </div>
      <div class="host-switcher" aria-label="Office 宿主">
        <button class="host-button" type="button" data-host="Word" aria-pressed="true">Word</button>
        <button class="host-button" type="button" data-host="PowerPoint" aria-pressed="false">PowerPoint</button>
        <button class="host-button" type="button" data-host="Excel" aria-pressed="false">Excel</button>
      </div>
    </header>

    <section class="office-window" aria-label="OfficePicture 产品原型">
      <div class="office-titlebar"><span id="officeTitle">项目报告.docx - Word</span></div>
      <div class="office-ribbon" aria-hidden="true">
        <div class="ribbon-tabs"><span>开始</span><span>插入</span><span>布局</span><span>审阅</span><span>视图</span></div>
        <div class="ribbon-tools">
          <div class="tool-group"><div class="tool-lines"></div><div class="tool-lines" style="width:52px"></div></div>
          <div class="tool-group"><div class="tool-lines" style="width:60px"></div><div class="tool-lines" style="width:82px"></div></div>
          <div class="tool-group"><div class="tool-lines" style="width:44px"></div><div class="tool-lines"></div></div>
        </div>
      </div>
      <div class="office-workspace">
        <div class="word-page">
          <div class="document-line"></div><div class="document-line"></div><div class="document-line short"></div>
          <div class="picture-selection" id="sourcePicture" title="双击打开预览">
            <svg class="sample-art" viewBox="0 0 960 540" role="img" aria-label="山谷与湖泊示例图片">
              <defs>
                <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#73b9e8"/><stop offset="1" stop-color="#d8edf7"/></linearGradient>
                <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4e91b7"/><stop offset="1" stop-color="#173f5b"/></linearGradient>
              </defs>
              <rect width="960" height="540" fill="url(#sky)"/>
              <circle cx="765" cy="108" r="44" fill="#fff4bd"/>
              <path d="M0 330 190 132 340 290 505 96 720 321 845 190 960 320V540H0Z" fill="#294b62"/>
              <path d="m93 300 97-168 66 116 34-37 50 79 165-194 106 147 40-49 69 127 125-131 115 130v60H0v-50Z" fill="#5a7783"/>
              <path d="m155 192 35-60 29 51-22-9-12 22-13-16Z" fill="#edf5f5"/>
              <path d="m447 164 58-68 48 67-31-12-18 24-25-23Z" fill="#f5f8f7"/>
              <path d="M0 348Q230 318 410 362t550-18v196H0Z" fill="url(#lake)"/>
              <path d="M0 386Q236 356 430 398t530-14" fill="none" stroke="#9bd4e4" stroke-width="8" opacity=".5"/>
              <path d="M120 356q48-48 96 0t96 0" fill="none" stroke="#d8eff4" stroke-width="4" opacity=".7"/>
            </svg>
            <span class="selection-handle tl"></span><span class="selection-handle tr"></span>
            <span class="selection-handle bl"></span><span class="selection-handle br"></span>
          </div>
          <div class="document-line"></div><div class="document-line"></div><div class="document-line tiny"></div>
        </div>
      </div>

      <div class="preview-overlay" id="previewOverlay" role="dialog" aria-modal="true" aria-label="图片预览">
        <div class="preview-toolbar">
          <span class="preview-brand">图片预览 · <span id="previewHost">Word</span></span>
          <button class="preview-command" type="button" id="fitButton">适应窗口</button>
          <button class="preview-command" type="button" id="actualButton">100%</button>
          <span class="preview-divider" aria-hidden="true"></span>
          <button class="preview-command" type="button" id="zoomOutButton" aria-label="缩小">－</button>
          <button class="preview-command" type="button" id="zoomInButton" aria-label="放大">＋</button>
          <output class="zoom-readout" id="zoomReadout" aria-live="polite">100%</output>
          <span class="preview-divider" aria-hidden="true"></span>
          <span class="preview-spacer"></span>
          <span class="image-size">原图 1920 × 1080px</span>
          <button class="preview-command preview-close" type="button" id="closeButton">关闭&nbsp; ✕</button>
        </div>
        <div class="preview-viewport" id="previewViewport">
          <div class="image-stage" id="imageStage">
            <svg class="preview-image" id="previewImage" viewBox="0 0 960 540" role="img" aria-label="山谷与湖泊预览图片">
              <defs>
                <linearGradient id="previewSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#73b9e8"/><stop offset="1" stop-color="#d8edf7"/></linearGradient>
                <linearGradient id="previewLake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4e91b7"/><stop offset="1" stop-color="#173f5b"/></linearGradient>
              </defs>
              <rect width="960" height="540" fill="url(#previewSky)"/>
              <circle cx="765" cy="108" r="44" fill="#fff4bd"/>
              <path d="M0 330 190 132 340 290 505 96 720 321 845 190 960 320V540H0Z" fill="#294b62"/>
              <path d="m93 300 97-168 66 116 34-37 50 79 165-194 106 147 40-49 69 127 125-131 115 130v60H0v-50Z" fill="#5a7783"/>
              <path d="m155 192 35-60 29 51-22-9-12 22-13-16Z" fill="#edf5f5"/>
              <path d="m447 164 58-68 48 67-31-12-18 24-25-23Z" fill="#f5f8f7"/>
              <path d="M0 348Q230 318 410 362t550-18v196H0Z" fill="url(#previewLake)"/>
              <path d="M0 386Q236 356 430 398t530-14" fill="none" stroke="#9bd4e4" stroke-width="8" opacity=".5"/>
              <path d="M120 356q48-48 96 0t96 0" fill="none" stroke="#d8eff4" stroke-width="4" opacity=".7"/>
            </svg>
          </div>
        </div>
      </div>
    </section>
    <footer class="prototype-footer">
      <span>操作：双击图片 · 滚轮缩放 · <kbd>+</kbd> <kbd>-</kbd> · <kbd>Esc</kbd> 关闭</span>
      <span>行为基线：OfficePicture 1.0.0.0</span>
    </footer>
  </main>

  <script>
    (() => {
      const hosts = {
        Word: { title: '项目报告.docx - Word', color: '#185abd', file: '项目报告.docx' },
        PowerPoint: { title: '季度汇报.pptx - PowerPoint', color: '#c43e1c', file: '季度汇报.pptx' },
        Excel: { title: '数据清单.xlsx - Excel', color: '#107c41', file: '数据清单.xlsx' }
      };
      const originalWidth = 1920;
      const originalHeight = 1080;
      const minZoom = 0.1;
      const maxZoom = 8;
      let currentHost = 'Word';
      let zoom = 1;
      let fitMode = true;

      const officeTitle = document.getElementById('officeTitle');
      const officeTitlebar = document.querySelector('.office-titlebar');
      const previewOverlay = document.getElementById('previewOverlay');
      const previewHost = document.getElementById('previewHost');
      const viewport = document.getElementById('previewViewport');
      const stage = document.getElementById('imageStage');
      const image = document.getElementById('previewImage');
      const readout = document.getElementById('zoomReadout');

      function clamp(value) { return Math.max(minZoom, Math.min(maxZoom, value)); }

      function layoutImage() {
        const width = Math.max(1, Math.round(originalWidth * zoom));
        const height = Math.max(1, Math.round(originalHeight * zoom));
        const left = Math.max(20, Math.round((viewport.clientWidth - width) / 2));
        const top = Math.max(20, Math.round((viewport.clientHeight - height) / 2));
        image.style.width = width + 'px';
        image.style.height = height + 'px';
        image.style.left = left + 'px';
        image.style.top = top + 'px';
        stage.style.width = Math.max(viewport.clientWidth, left + width + 20) + 'px';
        stage.style.height = Math.max(viewport.clientHeight, top + height + 20) + 'px';
        readout.value = Math.round(zoom * 100) + '%';
        readout.textContent = readout.value;
      }

      function fitImage() {
        if (!previewOverlay.classList.contains('is-open')) return;
        fitMode = true;
        zoom = clamp(Math.min((viewport.clientWidth - 40) / originalWidth, (viewport.clientHeight - 40) / originalHeight));
        layoutImage();
        viewport.scrollTo(0, 0);
      }

      function setZoom(value) {
        fitMode = false;
        zoom = clamp(value);
        layoutImage();
      }

      function openPreview() {
        previewHost.textContent = currentHost;
        previewOverlay.classList.add('is-open');
        document.getElementById('fitButton').focus();
        requestAnimationFrame(fitImage);
      }

      function closePreview() {
        previewOverlay.classList.remove('is-open');
        document.getElementById('sourcePicture').focus?.();
      }

      document.querySelectorAll('.host-button').forEach(button => {
        button.addEventListener('click', () => {
          currentHost = button.dataset.host;
          document.querySelectorAll('.host-button').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
          officeTitle.textContent = hosts[currentHost].title;
          officeTitlebar.style.background = hosts[currentHost].color;
          previewHost.textContent = currentHost;
          closePreview();
        });
      });

      document.getElementById('sourcePicture').addEventListener('dblclick', openPreview);
      document.getElementById('fitButton').addEventListener('click', fitImage);
      document.getElementById('actualButton').addEventListener('click', () => setZoom(1));
      document.getElementById('zoomOutButton').addEventListener('click', () => setZoom(zoom / 1.2));
      document.getElementById('zoomInButton').addEventListener('click', () => setZoom(zoom * 1.2));
      document.getElementById('closeButton').addEventListener('click', closePreview);
      viewport.addEventListener('wheel', event => {
        event.preventDefault();
        setZoom(zoom * (event.deltaY < 0 ? 1.15 : 1 / 1.15));
      }, { passive: false });
      window.addEventListener('keydown', event => {
        if (!previewOverlay.classList.contains('is-open')) return;
        if (event.key === 'Escape') closePreview();
        if (event.key === '+' || event.key === '=') setZoom(zoom * 1.2);
        if (event.key === '-' || event.key === '_') setZoom(zoom / 1.2);
      });
      new ResizeObserver(() => {
        if (fitMode) fitImage();
        else layoutImage();
      }).observe(viewport);
    })();
  </script>
</body>
</html>
